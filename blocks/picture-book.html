<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Picture-book reading</title>
<link rel="stylesheet" href="runtime/block.css">
<style>
  .pb-pic { position: relative; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--panel); line-height: 0; container-type: inline-size; }
  .pb-sign { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center; white-space: pre-line; line-height: 1.08; font-weight: 700; overflow: hidden; border: 0; background: transparent; padding: 0; font-family: inherit; }
  button.pb-sign:hover, button.pb-sign:focus-visible { outline: 2px dashed var(--accent); outline-offset: 1px; }
  .pb-signstrip { line-height: 1.4; padding: 6px 10px; font-size: .9rem; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .pb-ic { display: inline-block; width: 1em; height: 1em; vertical-align: -0.14em; flex: none; }
  .pb-ic svg { display: block; width: 100%; height: 100%; }
  .pb-peer, .pb-rule { border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; margin-top: 8px; font-size: .95rem; }
  .pb-peer b, .pb-rule b { display: block; font-size: .8rem; color: var(--muted); font-weight: 600; }
  .pb-rule p { margin: 0 0 4px; }
  .pb-unit { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: .92rem; }
  .pb-unit input { flex: 1 1 200px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--bg); }
  .pb-pic svg, .pb-pic img { display: block; width: 100%; height: auto; }
  .pb-pic.small { border-width: 1.5px; border-radius: 8px; }
  .pb-spot { position: absolute; border: 2px dashed transparent; border-radius: 10px; background: transparent; padding: 0; }
  .pb-spot:hover, .pb-spot:focus-visible { border-color: var(--accent); background: rgba(61, 79, 224, .08); }
  .pb-spot.heard { border-color: var(--accent); border-style: solid; }
  .pb-page { display: grid; gap: 14px; align-items: start; }
  [data-band="youth"] .pb-page { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  [data-band="adult"] .pb-page { grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 12px; }
  [data-band="child"] .pb-page { max-width: 760px; margin: 0 auto; }
  @media (max-width: 720px) { [data-band] .pb-page { grid-template-columns: 1fr; } }
  .pb-text { line-height: 2.1; margin: 0; word-break: keep-all; overflow-wrap: anywhere; }
  .pb-text.learn { font-size: 1.45rem; }
  [data-band="child"] .pb-text.learn { font-size: 2.1rem; line-height: 2.2; text-align: center; }
  [data-band="adult"] .pb-text.learn { font-size: 1.3rem; }
  .pb-text.read { font-size: 1.15rem; line-height: 2; }
  [data-band="child"] .pb-text.read { font-size: 1.5rem; }
  .pb-text.cjk { line-height: 2.4; }
  .pb-text.read.cjk { line-height: 2; }
  .pb-text.cjk button.pb-tok, .pb-text.cjk .pb-tok { padding: 0; border-radius: 3px; }
  .pb-tok { border-radius: 6px; padding: 0 1px; transition: background .15s; }
  button.pb-tok { border: 0; background: transparent; padding: 0 2px; font: inherit; line-height: inherit; color: inherit; }
  button.pb-tok:hover { background: var(--accent-soft); }
  .pb-tok.now { background: #ffe58a; color: #20222b; }
  .pb-tok.hit { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
  .pb-tok.miss { background: var(--bad-soft); }
  .pb-tok.target .pb-core { box-shadow: inset 0 -2px 0 var(--line); }
  .pb-tok.marked .pb-core { text-decoration: underline dotted var(--warn) 3px; text-underline-offset: 6px; }
  .pb-tok.marked::after { content: '?'; font-size: .6em; vertical-align: super; color: var(--warn); font-weight: 700; }
  .pb-tok.focus .pb-core { background: var(--warn-soft); box-shadow: inset 0 -3px 0 var(--warn); border-radius: 4px; }
  ruby rt { font-size: .5em; color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .rt-off rt { visibility: hidden; }
  .pb-peek { border: 1px dashed var(--line); background: var(--bg); border-radius: 6px; font: inherit; color: inherit; padding: 0 2px; line-height: inherit; }
  .pb-peek:hover { border-color: var(--accent); }
  .pb-aidbtn { font-size: .55em; vertical-align: super; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 0 6px; margin-left: 2px; }
  .pb-aidbtn.faint { opacity: .55; }
  .pb-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .speak-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; }
  .pb-steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .pb-steps button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; }
  .pb-steps button[aria-current="step"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pb-steps button .n { font-weight: 700; margin-right: 4px; }
  .pb-steps .done { border-color: #2e8b57; }
  .pb-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
  .pb-dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); }
  .pb-dots span.on { background: var(--accent); }
  .pb-head { margin-bottom: 12px; }
  .pb-head h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .pb-why { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
  .pb-why b { color: var(--ink); font-weight: 600; }
  .pb-adult { border-left: 4px solid var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; margin-top: 8px; font-size: .95rem; }
  .pb-adult b { display: block; font-size: .8rem; color: var(--warn); }
  .pb-say { font-size: 1.25rem; padding: 10px 20px; }
  .pb-opts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .pb-opts button { border: 2px solid var(--line); background: var(--panel); border-radius: 14px; padding: 10px 18px; font-size: 1.3rem; min-width: 84px; }
  [data-band="child"] .pb-opts button { font-size: 1.6rem; min-width: 110px; padding: 14px 20px; }
  .pb-opts button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); background: var(--accent-soft); }
  .pb-opts button.ok { border-color: #2e8b57; box-shadow: 0 0 0 2px #2e8b57; }
  .pb-opts button.no { border-color: var(--bad); }
  .pb-word { font-size: 3rem; text-align: center; margin: 8px 0; letter-spacing: .04em; }
  [data-band="child"] .pb-word { font-size: 4rem; }
  .pb-hint { text-align: center; font-size: 1.5rem; color: var(--warn); margin: 4px 0; }
  .pb-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pb-chips span, .pb-chips button { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--panel); font-size: .95rem; }
  .pb-chips .independent { border-color: #2e8b57; background: var(--accent-soft); }
  .pb-chips .assisted { border-color: var(--warn); }
  .pb-chips .wrong { border-color: var(--bad); }
  .pb-chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); }
  .pb-two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pb-two > div { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
  .pb-two h4, .pb-rec h4 { margin: 0 0 4px; font-size: .8rem; color: var(--muted); font-weight: 600; }
  .pb-count { font-size: .95rem; }
  .pb-count b { font-size: 1.2rem; }
  .pb-thumbs { display: grid; grid-template-columns: repeat(var(--n, 8), minmax(0, 1fr)); gap: 6px; }
  @media (max-width: 640px) { .pb-thumbs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .pb-thumbs button { all: unset; cursor: pointer; display: block; position: relative; border-radius: 8px; }
  .pb-thumbs button:focus-visible { outline: 3px solid var(--focus); }
  .pb-thumbs button[aria-pressed="true"] .pb-pic { box-shadow: 0 0 0 3px var(--accent); }
  .pb-thumbs .num { position: absolute; left: 3px; top: 3px; font-size: .72rem; line-height: 1.3; background: var(--panel); border-radius: 6px; padding: 0 5px; }
  .pb-bets { display: grid; gap: 8px; margin-top: 8px; }
  .pb-bets button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 12px; }
  .pb-bets button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); }
  .pb-edit { margin-top: 10px; border: 1px dashed var(--warn); border-radius: 10px; padding: 8px 10px; background: var(--warn-soft); }
  .pb-edit input, .pb-text-in { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--bg); }
  textarea.pb-text-in { min-height: 110px; resize: vertical; }
  .pb-layout { display: grid; gap: 16px; }
  [data-band="youth"] .pb-layout { grid-template-columns: minmax(0, 1fr) 240px; }
  @media (max-width: 860px) { [data-band="youth"] .pb-layout { grid-template-columns: 1fr; } }
  .pb-rec { font-size: .9rem; }
  .pb-rec ul { margin: 0; padding-left: 18px; }
  .pb-rec li { margin: 2px 0; }
  .pb-brief { margin-top: 18px; font-size: .88rem; }
  .pb-brief summary { cursor: pointer; color: var(--muted); }
  .pb-brief dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 8px 0; }
  .pb-brief dt { color: var(--muted); }
  .pb-brief dd { margin: 0; }
  .pb-brief pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: .8rem; }
  .pb-choose { max-width: 820px; margin: 0 auto; display: grid; gap: 14px; }
  .pb-q { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .pb-q p { margin: 0; flex: 1 1 260px; }
  .pb-pill { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .pb-pill button { border: 0; background: transparent; padding: 5px 14px; }
  .pb-pill button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .pb-modecards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .pb-modecards { grid-template-columns: 1fr; } }
  .pb-modecards button { text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px 14px; }
  .pb-modecards button.rec { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .pb-modecards b { display: block; font-size: 1.05rem; margin-bottom: 4px; }
  .pb-modecards small { display: block; color: var(--muted); }
  .pb-band { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .pb-band button { border: 0; background: transparent; padding: 6px 12px; }
  .pb-band button[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; }
  .pb-title { font-size: 1.6rem; text-align: center; margin: 8px 0 0; }
  @media (max-width: 480px) { html[lang="en"] .kb-modes button { padding: 6px 9px; } .pb-word { font-size: 2.4rem; } }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
<script src="age-design.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var h = KTBlock.h, shuffle = KTBlock.shuffle, L = KTBlock.L, tx = KTBlock.t, EN = KTBlock.lang === 'en';
  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'picture-book-en';
  var reg = (window.KT_REGISTRY && KT_REGISTRY.packs) || {};
  var entry = reg[setId] || {};
  var app = document.getElementById('app');
  if (entry.block && entry.block !== 'picture-book') { app.textContent = L('数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在绘本阅读里打开。', 'Data pack ' + setId + ' belongs to the block ' + entry.block + ' and cannot be opened in picture-book reading.'); return; }
  var file = entry.file || 'data/picture-book.js';      // fallback while the registry does not list the pack yet
  var s = document.createElement('script');
  s.src = file;
  s.onload = function () { if (!window.KT_DATA || !KT_DATA[setId]) { app.textContent = L('未知的数据包：', 'Unknown data pack: ') + setId; return; } start(KT_DATA[setId]); };
  s.onerror = function () { app.textContent = L('数据包加载失败：', 'Could not load the data pack: ') + file; };
  document.head.appendChild(s);

  var TYPE = {
    tone: ['声调不一样。', 'The tone is different.'],
    'same-part': ['这是带同一个部件的另一个字的读音；这里的部件不管读音。', 'That is the sound of another character with the same part; here the part does not give the sound.'],
    'other-reading': ['这是同一个字的另一种读法，这里不这么读。', 'That is another reading of the same character; it is not read that way here.'],
    'look-alike': ['那个和它长得像，但不是它。', 'That one looks like it, but it is a different word.'],
    vowel: ['中间的元音不一样。', 'The vowel in the middle is different.'],
    blend: ['少了或多了一个音。', 'A sound is missing or added.'],
    meaning: ['这是按图或意思猜的，不是读出来的。', 'That is a guess from the picture or the meaning, not from reading it.'],
    story: ['这是书里这个位置的另一个词——像是背出来的，不是读出来的。', 'That is a word from the book at this point: it looks remembered, not read.']
  };
  var SPOT = { boy: ['男孩', 'the boy'], boat: ['小船', 'the boat'], window: ['窗户', 'the window'], gate: ['门', 'the gate'], grandpa: ['爷爷', 'Grandpa'], water: ['水', 'the water'],
    bridge: ['桥', 'the bridge'], frog: ['青蛙', 'the frog'], stone: ['石头', 'the stone'], duck: ['鸭子', 'the duck'], reeds: ['芦苇', 'the reeds'], branch: ['树枝', 'the branch'], pond: ['池塘', 'the pond'] };
  var CLUES = [{ id: 'picture', zh: '图', en: 'The picture' }, { id: 'context', zh: '前后的话', en: 'The words around it' }, { id: 'parts', zh: '词里的字或部件', en: 'The parts of the word' }, { id: 'none', zh: '这一页看不出来——要查', en: 'Nothing here tells me exactly: look it up' }];
  var BASIS = [{ id: 'picture', zh: '画上的线索', en: 'Something in the picture' }, { id: 'title', zh: '书名', en: 'The title' }, { id: 'earlier', zh: '前面读到的', en: 'What I read earlier' }, { id: 'none', zh: '没有特别的理由', en: 'No particular reason' }];

  function start(raw) {
    /* two books: the children's picture book (top level of the pack) for band=child, and the teen/adult story (pack.older) for youth and adult */
    var bandParam = params.get('band');
    var band = ['child', 'youth', 'adult'].indexOf(bandParam) >= 0 ? bandParam : (params.get('variant') === 'child' ? 'child' : 'adult');
    function bookFor(b) { return b !== 'child' && raw.older ? Object.assign({}, raw, raw.older, { id: raw.id, lang: raw.lang, speech: raw.speech }) : raw; }
    var pack = bookFor(band), scene = KT_SCENES[pack.scene];
    var isCJK = pack.lang === 'zh' || pack.lang === 'ja';
    var title = tx(pack, 'title');
    var B = KTBlock.init({ id: 'picture-book', primitive: 'prim:reading-aid-fade', title: title, set: pack.id });
    document.title = title + ' · Picture-book reading';
    function renderAgeWhy() {   // shared panel: which design variables this age version changes, and why
      var box = document.getElementById('age-why'); if (!box || !KTBlock.ageWhy) return;
      var open = box.firstChild && box.firstChild.open; box.innerHTML = '';
      var el = KTBlock.ageWhy('picture-book', band); if (el) { el.open = !!open; box.style.margin = '0 clamp(12px, 3vw, 28px)'; box.append(el); }
    }
    function setBand(b) {
      band = b; setTimeout(renderAgeWhy, 0); B.variant = b === 'child' ? 'child' : 'adult';
      document.documentElement.dataset.variant = B.variant; document.documentElement.dataset.band = b;
      try { var u = new URL(location.href); u.searchParams.set('band', b); u.searchParams.delete('variant'); history.replaceState(null, '', u); } catch (e) { /* file:// in some browsers */ }
    }
    setBand(band);
    function fill(s) { return String(s).replace(/\{(\w+)\}/g, function (m, k) { var n = pack.names || {}; return n[k] != null ? tx(n, k) : m; }); }
    function child() { return band === 'child'; }

    /* ---------- the two workflows ---------- */
    var MODES = [{ id: 'learn-to-read', label: L('学认字', 'Learning to read') }, { id: 'read-to-learn', label: L('借读书学语言', 'Reading to learn') }];
    var aidName = tx(pack, 'aidLabel');
    var STEPS = {
      'learn-to-read': [
        { id: 'walk', prim: 'prim:picture-describe', label: L('看图说', 'Picture walk'),
          instr: L('先不读正文。一页一页看图，说说图上有什么、接下来会怎么样。点图上的东西，可以听它叫什么。', 'Leave the text for now. Go through the pictures page by page and say what is there and what might happen next. Tap something in a picture to hear its name.'),
          purpose: L('先用耳朵把故事里的词听熟，读的时候就是在“认出”已经会说的词。', 'Meet the story\'s words by ear first, so that reading becomes recognising words you can already say.'),
          trains: L('练口语理解，把词先备好；这一步不认字，也不打分。', 'Trains listening comprehension and gets the words ready; no reading yet, and nothing is scored.'),
          peer: L('两人一组：一人只看图描述一页，另一人不看，猜是第几页。', 'In pairs: one describes a page from the picture only; the other, not looking, says which page it is.'),
          adult: L('指着图问：“这是什么？”“接下来会怎么样？”孩子说了，就顺着他的话再说一句。', 'Point and ask: "What\'s this?" "What will happen next?" When the child answers, add a sentence to what they said.') },
        { id: 'listen', prim: 'prim:oral-to-print', label: L('听着指字', 'Listen and follow'),
          instr: L('听这一页：读到哪个词，哪个词就亮，用手指跟着点。然后按“找一个词”：听到哪个词，就点哪个词。', 'Listen to the page: each word lights up as it is read, and you follow with your finger. Then press "Find a word" and tap the word you hear.'),
          purpose: L('把听得懂的声音和纸上的字一个一个对上。', 'Match the sounds you already understand to the words on the page, one by one.'),
          trains: L('练声音和文字的对应；“找一个词”打乱了顺序，背下整句帮不上忙。', 'Trains sound-to-print matching; "find a word" is out of order, so a memorised sentence does not help.'),
          peer: L('两人一组：轮流念这一页上的一个词，让对方在页上找出来。', 'In pairs: take turns saying a word from the page for the other to find.'),
          adult: L('请孩子把手指放在正在读的词下面；找词时别替他指。', 'Ask the child to keep a finger under the word being read; in "find a word", don\'t point for them.') },
        { id: 'decode', prim: 'prim:sound-spelling-blend', label: L('自己读', 'Read it yourself'),
          instr: L('图收起来了。先自己读这个词，再挑出它的读音。读不出来就按“拆开看看”，先别看答案。', 'The picture is put away. Read the word yourself first, then pick how it sounds. If it won\'t come, press "Split it up" before anything else.'),
          purpose: L('不靠图猜，真的把字读出来。', 'Read the word for real, without guessing from the picture.'),
          trains: L('练解码：先作答，后放音；拆开的提示在答案之前，用过提示记为“提示后完成”。', 'Trains decoding: answer first, sound after; the split-up hint comes before the answer, and using it marks the word as helped.'),
          peer: L('给同学出一题：挑一个目标词，说出你觉得它最容易被读成什么、为什么。', 'Set a classmate a question: pick a target word and say what it is most easily misread as, and why.'),
          adult: L('等孩子先试；卡住时按“拆开看看”，别把词说出来。', 'Let the child try first; if stuck, press "Split it up". Don\'t say the word for them.') },
        { id: 'fade', prim: 'prim:reading-aid-fade', label: L('再读，注音慢慢撤', 'Reread, aids fading'),
          instr: L('再读一遍整本书。' + aidName + '一个词一个词地撤：没有' + aidName + '、也没偷看，两轮都读对，这个词的' + aidName + '就撤掉；读错了，它会回来。', 'Read the whole book again. The aid (' + aidName + ') comes off word by word: read a word right in two rounds with no aid and no peeking, and its aid goes. Read it wrong and the aid comes back.'),
          purpose: L('分清“靠注音读对”和“自己读对”。', 'Tell apart "read it with the aid" and "read it on my own".'),
          trains: L('注音逐步撤除：只有注音没显示、也没偷看时读对，才算独立；同一次练习里的两轮算两次（契约要求隔一天）。', 'Reading-aid fading: only a right answer with no aid showing and no peeking counts as independent; two rounds in one sitting count as two (the contract asks for a day apart).'),
          peer: L('和同学比的是自己的“不用注音”清单长了多少，不比谁快。', 'Compare with a classmate how much your own "no aid needed" list has grown, not who is faster.'),
          adult: L('不要替孩子读。孩子点开偷看没关系，页面会记下来。', 'Don\'t read for the child. Peeking is fine; the page notes it.') },
        { id: 'reverse', prim: 'prim:carry-across', label: L('换个地方还认得吗', 'Somewhere new'),
          instr: L('这些句子书里没有，也没有图。读出标出来的词，挑出它的读音。', 'These sentences are not in the book and have no picture. Read the marked word and pick how it sounds.'),
          purpose: L('看看你是真的会读这个词，还是记住了故事。', 'Checks whether you can read the word, or had just remembered the story.'),
