<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space and viewpoint (3D)</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="runtime/block.css">
<style>
  :root { --tone1: #f6e7c8; --tone2: #dcebf7; --tone3: #e4f2df; --tone4: #f3e0ea; --you: #3d4fe0; --ghost: #c0392b; }
  :root[data-theme="dark"] { --tone1: #3b331f; --tone2: #1f3140; --tone3: #24382a; --tone4: #3a2633; --you: #93a0ff; --ghost: #ff8a7a; }
  .kb-head .kb-variant { display: none; }
  .s3-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .s3-layout { grid-template-columns: minmax(0, 1fr); } }
  .s3-layout > * { min-width: 0; }
  .s3-side { display: grid; gap: 12px; }
  .s3-stage { display: grid; gap: 10px; }
  .s3-bands { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .s3-bands button { border: 0; background: var(--panel); padding: 5px 12px; }
  .s3-bands button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .s3-view { position: relative; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); overflow: hidden; outline: none; }
  .s3-view:focus-visible { box-shadow: 0 0 0 3px var(--focus); }
  .s3-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .s3-tools button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: .88rem; min-width: 34px; }
  .s3-tools button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .s3-tools .be { font-size: 1.05rem; padding: 7px 16px; border-color: var(--accent); }
  .s3-tools .sep { flex: 1; }
  .s3-canvas { position: relative; height: 380px; touch-action: none; cursor: grab; }
  [data-band="adult"] .s3-canvas { height: 320px; }
  [data-band="child"] .s3-canvas { height: 440px; }
  @media (max-width: 520px) { .s3-canvas, [data-band="adult"] .s3-canvas { height: 290px; } [data-band="child"] .s3-canvas { height: 340px; } }
  .s3-canvas canvas { display: block; width: 100%; height: 100%; }
  .s3-ov { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .s3-ov .lab { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: .78rem; padding: 1px 6px; border-radius: 6px;
    background: color-mix(in srgb, var(--panel) 85%, transparent); color: var(--ink); border: 1px solid var(--line); }
  [data-variant="child"] .s3-ov .lab { font-size: .95rem; }
  .s3-ov .lab.fig { font-weight: 600; }
  .s3-ov button.lab { pointer-events: auto; cursor: pointer; border-color: var(--accent); }
  .s3-ov .eye { position: absolute; transform: translate(-50%, -100%); font-size: .82rem; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
  .s3-ov .eye.ghost { background: transparent; color: var(--ghost); border: 2px dashed var(--ghost); }
  .s3-ov .spot { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; width: 36px; height: 36px; border-radius: 50%;
    border: 2px dashed var(--accent); background: color-mix(in srgb, var(--panel) 80%, transparent); font-weight: 700; color: var(--accent); }
  [data-variant="child"] .s3-ov .spot { width: 48px; height: 48px; font-size: 1.2rem; }
  .s3-ov .spot.ok { border-style: solid; border-color: var(--t2); color: var(--t2); }
  .s3-ov .spot.bad { border-style: solid; border-color: var(--bad); color: var(--bad); }
  .s3-2d { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding: 8px; touch-action: pan-y; }
  @media (max-width: 700px) { .s3-2d { grid-template-columns: minmax(0, 1fr); } }
  .s3-2d figure { margin: 0; display: grid; gap: 4px; }
  .s3-2d figcaption { font-size: .8rem; color: var(--muted); }
  .s3-2d svg { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .m-floor { fill: var(--panel); } .m-grid { stroke: var(--line); stroke-width: .02; }
  .m-t { fill: var(--ink); font-family: var(--font); font-size: .34px; paint-order: stroke; stroke: var(--panel); stroke-width: .08px; stroke-linejoin: round; }
  [data-variant="child"] .m-t { font-size: .42px; }
  .m-area-t { fill: var(--muted); font-family: var(--font); font-size: .3px; }
  .m-tone1 { fill: var(--tone1); } .m-tone2 { fill: var(--tone2); } .m-tone3 { fill: var(--tone3); } .m-tone4 { fill: var(--tone4); }
  .m-path { stroke: var(--accent); stroke-width: .07; fill: none; stroke-dasharray: .2 .14; }
  .m-zone { fill: color-mix(in srgb, var(--accent) 10%, transparent); stroke: var(--accent); stroke-width: .04; stroke-dasharray: .14 .1; }
  .m-zone.l { fill: color-mix(in srgb, var(--t3) 12%, transparent); stroke: var(--t3); }
  .m-ghost { fill: none; stroke: var(--ghost); stroke-width: .06; stroke-dasharray: .16 .1; }
  .m-hl { fill: none; stroke: var(--t3); stroke-width: .07; }
  .m-spot circle { fill: var(--panel); stroke: var(--accent); stroke-width: .05; stroke-dasharray: .12 .08; }
  .m-spot text { fill: var(--accent); font-family: var(--font); font-size: .36px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .m-spot.ok circle { stroke: var(--t2); stroke-dasharray: none; } .m-spot.ok text { fill: var(--t2); }
  .m-spot.bad circle { stroke: var(--bad); stroke-dasharray: none; } .m-spot.bad text { fill: var(--bad); }
  .m-spot { cursor: pointer; } .m-spot:focus { outline: none; } .m-spot:focus-visible circle { stroke-width: .1; }
  [data-fig] { cursor: pointer; }
  .m-cam { fill: color-mix(in srgb, var(--accent) 16%, transparent); stroke: var(--accent); stroke-width: .03; }
  .e-sky { fill: color-mix(in srgb, var(--accent) 7%, var(--panel)); } .e-ground { fill: color-mix(in srgb, var(--t2) 10%, var(--panel)); }
  .e-t { fill: var(--ink); font-family: var(--font); font-size: 11px; text-anchor: middle; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
  .e-note { fill: var(--muted); font-family: var(--font); font-size: 11px; }
  .s3-sit { margin: 0; font-size: 1rem; }
  .s3-q { font-size: 1.45rem; margin: 0; line-height: 1.8; }
  [data-variant="child"] .s3-q { font-size: 1.8rem; }
  .s3-q .gap { display: inline-block; min-width: 2.6em; border-bottom: 3px solid var(--accent); text-align: center; color: var(--accent); }
  .s3-q .gap.ok { color: var(--ink); background: var(--accent-soft); border-radius: 6px 6px 0 0; }
  .s3-r { color: var(--muted); font-size: .9rem; margin: 0; }
  .s3-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .s3-opt { display: inline-flex; align-items: center; gap: 2px; }
  .s3-opt .f { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 16px; font-size: 1.1rem; }
  [data-variant="child"] .s3-opt .f { font-size: 1.6rem; padding: 10px 26px; }
  .s3-opt .f.right { background: var(--accent-soft); border-color: var(--accent); }
  .s3-opt .f.wrong { background: var(--bad-soft); border-color: var(--bad); }
  .s3-opt .say { border: 0; background: transparent; font-size: 1rem; padding: 4px; }
  .s3-opts.col { flex-direction: column; align-items: stretch; }
  .s3-opts.col .s3-opt .f { text-align: left; width: 100%; font-size: 1.05rem; border-radius: 12px; }
  .s3-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .s3-read { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .92rem; }
  .s3-read .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--panel); }
  .s3-read .chip.cur { border-color: var(--accent); background: var(--accent-soft); }
  .s3-read .chip b { font-size: 1.05rem; }
  .s3-adult { border-left: 4px solid var(--t3); }
  .s3-rule { border-left: 4px solid var(--accent); }
  .s3-rule h2, .s3-side h2 { font-size: .95rem; margin: 0 0 6px; }
  .s3-side p { margin: 4px 0; font-size: .9rem; }
  .s3-prog { font-size: .85rem; margin: 0; padding-left: 18px; }
  .s3-ic { width: 1.1em; height: 1.1em; vertical-align: -0.18em; flex: none; }
  .s3-rec > summary { cursor: pointer; font-size: .9rem; font-weight: 600; color: var(--muted); }
  .s3-rec[open] > summary { margin-bottom: 6px; }
  .s3-text { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel); font-size: 1.05rem; }
  .s3-made { font-size: .88rem; margin: 4px 0 0; padding-left: 18px; }
  .flag { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .s3-done { font-size: 2.2rem; text-align: center; margin: 0; }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
<script src="age-design.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var h = KTBlock.h, L = KTBlock.L, T = KTBlock.t, EN = KTBlock.lang === 'en';
  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'space-3d-en';
  var reg = (window.KT_REGISTRY && KT_REGISTRY.packs) || {};
  var entry = reg[setId] || {};
  var app = document.getElementById('app');
  if (entry.block && entry.block !== 'space-3d') { app.textContent = L('数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在这里打开。', 'Data pack ' + setId + ' belongs to the block ' + entry.block + ' and cannot be opened here.'); return; }
  var file = entry.file || 'data/space-3d.js';   // fallback while the registry does not list the pack yet
  var ds = document.createElement('script');
  ds.src = file;
  ds.onload = function () { if (KT_DATA[setId] && window.KT_SCENES && KT_SCENES[KT_DATA[setId].scenes]) start(KT_DATA[setId], KT_SCENES[KT_DATA[setId].scenes]); else app.textContent = L('未知的数据包：', 'Unknown data pack: ') + setId; };
  ds.onerror = function () { app.textContent = L('数据包加载失败：', 'Could not load the data pack: ') + file; };
  document.head.appendChild(ds);

  var THREE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  var NEAR = 1.3;
  /* Sizes in metres. fig = has eyes (can be a viewpoint); r = footprint radius; eye = eye height. */
  var KIND = {
    person: { fig: true, h: 1.7, r: 0.32, eye: 1.6 }, you: { fig: true, h: 1.7, r: 0.32, eye: 1.6 },
    bear: { fig: true, h: 1.45, r: 0.45, eye: 1.2 }, rabbit: { fig: true, h: 1.45, r: 0.36, eye: 0.95 }, cat: { fig: true, h: 0.5, r: 0.3, eye: 0.4 },
    apple: { h: 0.34, r: 0.18 }, ball: { h: 0.4, r: 0.2 }, cake: { h: 0.32, r: 0.3 }, cup: { h: 0.26, r: 0.13 }, phone: { h: 0.06, r: 0.15 },
    laptop: { h: 0.24, r: 0.24 }, file: { h: 0.05, r: 0.2 }, umbrella: { h: 0.9, r: 0.12 }, tree: { h: 2.6, r: 0.6 },
    poster: { h: 1.6, w: 1.2, panel: true, base: 0.5 }, window: { h: 1.4, w: 1.5, panel: true, base: 0.7 }, door: { h: 2.0, w: 1.0, panel: true, base: 0 },
    screen: { h: 1.3, w: 2.0, panel: true, base: 0.6 }, tower: { h: 4.6, w: 1.4, d: 1.4 }, car: { h: 1.2, w: 1.1, len: 2.2, eye: 1.2 },
    hotel: { h: 2.6 }, table: { h: 0.75 }
  };
  var TONE = { 1: '#f6e7c8', 2: '#dcebf7', 3: '#e4f2df', 4: '#f3e0ea' };

  /* ---------- geometry (shared by both renderers and by the checks) ---------- */
  function faceVec(deg) { var a = (deg || 0) * Math.PI / 180; return { x: Math.sin(a), z: -Math.cos(a) }; }
  function leftOf(f) { return { x: f.z, z: -f.x }; }
  function sub(a, b) { return { x: a.x - b.x, z: a.z - b.z }; }
  function dot(a, b) { return a.x * b.x + a.z * b.z; }
  function len(a) { return Math.sqrt(a.x * a.x + a.z * a.z); }
  function norm(a) { var l = len(a) || 1; return { x: a.x / l, z: a.z / l }; }
  function neg(a) { return { x: -a.x, z: -a.z }; }
  function dist(a, b) { return len(sub(a, b)); }
  var CARD = [{ id: 'N', x: 0, z: -1 }, { id: 'E', x: 1, z: 0 }, { id: 'S', x: 0, z: 1 }, { id: 'W', x: -1, z: 0 }];
  /** Axes of a frame of reference around ref: fr = the direction that counts as “front”, lf = “left”. */
  function axes(frame, ref, viewer) {
    if (frame === 'intrinsic') { var fr = faceVec(ref.face); return { fr: fr, lf: leftOf(fr) }; }
    var f = norm(sub(ref, viewer));          // the viewer looks at ref
    return { fr: neg(f), lf: leftOf(f) };   // front of ref = toward the viewer; left = the viewer's left
  }
  function dirWord(v, ax) { var a = dot(v, ax.fr), b = dot(v, ax.lf); return Math.abs(a) >= Math.abs(b) ? (a > 0 ? 'front' : 'back') : (b > 0 ? 'left' : 'right'); }
  function wantVec(word, ax) { return word === 'front' ? ax.fr : word === 'back' ? neg(ax.fr) : word === 'left' ? ax.lf : neg(ax.lf); }
  function bestCard(v) { var best = null, bd = -9; CARD.forEach(function (c) { var d = dot(c, v); if (d > bd) { bd = d; best = c.id; } }); return best; }
  function extent(t, c) {
    if (t.kind === 'car') { var along = Math.abs(dot(faceVec(t.face), c)); return along > 0.5 ? KIND.car.len / 2 : KIND.car.w / 2; }
    if (t.w) { var f = faceVec(t.face || 0), across = Math.abs(dot(leftOf(f), c)); return across > 0.5 ? t.w / 2 : (t.d || t.w) / 2; }
    return (KIND[t.kind] && KIND[t.kind].r) || 0.3;
  }
  /** Which zone a thing is in when `sp` speaks to `li` (demonstratives). */
  function zoneOf(thing, sp, li) {
    if (dist(thing, sp) <= NEAR) return 'speaker';
    if (li && dist(thing, li) <= NEAR) return 'listener';
    return 'far';
  }

  function start(pack, SC) {
    var B = KTBlock.init({ id: 'space-3d', primitive: 'prim:viewpoint-direction', title: T(pack, 'title') });
    var band = params.get('band');
    if (['child', 'youth', 'adult'].indexOf(band) < 0) band = params.get('variant') === 'child' ? 'child' : 'adult';
    function applyBand() { B.variant = band === 'child' ? 'child' : 'adult'; document.documentElement.dataset.variant = B.variant; document.documentElement.dataset.band = band; }
    applyBand();
    var child = function () { return band === 'child'; };
    var title = T(pack, 'title');
    document.title = title + ' · 3D';
    var MODES = [{ id: 'here', label: L('这儿／那儿', 'Here / there') }, { id: 'come', label: L('来／去', 'Come / go') }, { id: 'frame', label: L('前后左右', 'Front, back, left, right') }];
    var st = {
      mode: MODES.some(function (m) { return m.id === params.get('mode'); }) ? params.get('mode') : 'here',
      step: params.get('step') === 'make' ? 'make' : 'practice',
      queue: [], idx: 0, item: null, phase: null, tries: [], meFirst: null, hint: 0, sameRun: [], tried: {}, answered: false,
      make: null
    };
    var ui = KTBlock.chrome(B, { title: title, subtitle: T(pack, 'subtitle'), modes: MODES, mode: st.mode,
      onMode: function (m) { st.mode = m; ui.setMode(m); st.step = 'practice'; B.emit('view', { mode: m }); enterMode(); } });
    var bar = h('div', { class: 'kb-bar' });
    var stage = h('div', { class: 'kb-card s3-stage' });
    var side = h('aside', { class: 's3-side' });
    var ageBox = h('div', { id: 'age-why' });
    app.append(ui.header, h('main', { class: 'kb-main' }, [bar, ageBox, h('div', { class: 's3-layout' }, [stage, side])]), ui.drawer);
    B.emit('view', { mode: st.mode, set: pack.id, band: band });

    /* ---------- names ---------- */
    function fill(s) { return String(s || '').replace(/\{(\w+)\}/g, function (m, k) { return (pack.names && pack.names[k]) || m; }); }
    function thingOf(id) { return M.things.filter(function (t) { return t.id === id; })[0]; }
    function nameOf(id) {
      var t = thingOf(id);
      if (t && t.kind === 'you') return T(SC.figLabels.you, 'zh');
      if (t && t.kind === 'cat') return T(SC.figLabels.cat, 'zh');
      if (t && t.label) return fill(T(t.label, 'zh'));
      if (pack.names[id]) return pack.names[id];
      var a = (M.areas || []).filter(function (x) { return x.id === id; })[0];
      return a ? fill(T(a.label, 'zh')) : id;
    }
    function isFig(t) { return t && KIND[t.kind] && KIND[t.kind].fig; }

    /* ---------- the scene model: one object, drawn by either renderer ---------- */
    var M = { things: [], areas: [], pos: {}, path: null, cam: { mode: 'orbit', yaw: 0, pitch: 38, dist: 8.6 }, eyeMark: null, ghostEye: null,
      zones: null, ghost: null, hl: [], spots: null, pickFigs: false, big: false, hideFig: null };
    function loadScene(id) {
      var s = SC.scenes[id];
      M.sceneId = id; M.title = fill(T(s.title, 'zh')); M.big = !!s.big || child();
      M.things = s.things.map(function (t) { return Object.assign({}, t); });
      M.areas = (s.areas || []).map(function (a) { return Object.assign({}, a); });
      M.slots = s.slots || {};
      M.pos = {};
      M.things.forEach(function (t) { M.pos[t.id] = { x: t.x, z: t.z, face: t.face }; });
      M.path = s.path ? { thing: s.path.thing, from: { x: thingOf(s.path.thing).x, z: thingOf(s.path.thing).z }, to: { x: s.path.to[0], z: s.path.to[1] } } : null;
      M.eyeMark = null; M.ghostEye = null; M.zones = null; M.ghost = null; M.hl = []; M.spots = null; M.pickFigs = false; M.hideFig = null;
      if (M.cam.mode === 'eye' && !thingOf(M.cam.fig)) M.cam = { mode: 'orbit', yaw: 0, pitch: 38, dist: 8.6 };
      R.setScene(M);
    }
    function P(id) { return M.pos[id]; }
    function elevation(t, p) {
      var k = KIND[t.kind];
      if (!k || k.fig || k.panel || ['tree', 'tower', 'car', 'hotel', 'table', 'umbrella'].indexOf(t.kind) >= 0) return 0;
      var on = M.things.filter(function (u) { return u.kind === 'table' && Math.abs(p.x - u.x) <= u.w / 2 && Math.abs(p.z - u.z) <= u.d / 2; })[0];
      return on ? KIND.table.h : 0;
    }
    function figScale(t) { return (t.small ? 0.75 : 1) * (M.big && !isFig(t) ? 1.5 : 1); }
    function camView() {
      if (M.cam.mode === 'eye') {
        var t = thingOf(M.cam.fig), p = P(M.cam.fig);
        if (t && p) { var ff = faceVec(p.face), back = t.kind === 'car' ? 0.2 : 0.5; return { x: p.x - ff.x * back, z: p.z - ff.z * back, f: ff, h: (KIND[t.kind].eye || 1.5) * (t.small ? 0.75 : 1) + 0.15, self: t.id, name: nameOf(t.id) }; }
      }
      var a = M.cam.yaw * Math.PI / 180, R0 = 6.2;
      var pos = { x: Math.sin(a) * R0, z: Math.cos(a) * R0 };
      return { x: pos.x, z: pos.z, f: norm(neg(pos)), h: 1.7, self: null, name: null };
    }

    /* ---------- 2D renderer: top-down map + eye view (also the fallback when 3D is unavailable) ---------- */
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    /* Interface icons are inline SVG (no emoji). Without a label the icon is decorative: the text or aria-label beside it carries the meaning. */
    var ICONS = {
      eye: '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
      speaker: '<path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/>'
    };
    function iconHtml(name, label) {
      return '<svg class="s3-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" ' +
        (label ? 'role="img" aria-label="' + esc(label) + '"' : 'aria-hidden="true"') + '>' + ICONS[name] + '</svg>';
    }
    function icon(name, label) { var t = document.createElement('template'); t.innerHTML = iconHtml(name, label); return t.content.firstChild; }
    function Renderer2D(root) {
      var wrap = h('div', { class: 's3-2d' });
      var mapFig = h('figure'), eyeFig = h('figure');
      wrap.append(mapFig, eyeFig);
      root.append(wrap);
      function figTop(t, p, s) {

        if (st.hint >= 3 && it.swap) { var a1 = (it.forms.filter(function (f) { return f.ok; })[0] || {}).t, a2 = (it.swap.forms.filter(function (f) { return f.ok; })[0] || {}).t; hints.push(L('同一件事，两种视点：', 'The same thing from two viewpoints: ') + nameOf(it.speaker) + ' — ' + fillQ(it, a1) + ' / ' + nameOf(it.swap.speaker) + ' — ' + fillQ(it.swap, a2)); }
        stage.append(h('div', { class: 's3-row' }, [h('button', { class: 'kb-btn', disabled: st.hint >= (it.swap ? 3 : 2), onclick: hint }, L('提示（算辅助）', 'Hint (counts as help)'))].concat(hints.map(function (x) { return h('span', { class: 'kb-note', text: x }); }))));
      }
      stage.append(fbBox());
      if (st.answered) {
        var nx = st.phase === 'after' && it.swap ? h('button', { class: 'kb-btn primary', onclick: toSwap }, child() ? L('换' + nameOf(it.swap.speaker) + '说 →', 'Now ' + nameOf(it.swap.speaker) + ' →') : L('换一个人说 →', 'Swap the speaker →')) : h('button', { class: 'kb-btn primary', onclick: next }, L('下一题 →', 'Next →'));
        stage.append(h('div', { class: 's3-row' }, [nx, h('span', { class: 'kb-note', text: child() ? L('按“当' + nameOf(c.speaker) + '”，看看他看到的。', 'Press “Be ' + nameOf(c.speaker) + '” and look.') : L('换到别人的眼睛看看，上面的词跟着变不变。', 'Switch to someone else’s eyes and see whether the word above changes.') })]));
      }
      stage.append(h('p', { class: 'kb-note s3-snote' }));
    }
    function renderFrame(it) {
      if (it.kind === 'place') {
        stage.append(h('p', { class: 's3-q', lang: pack.lang }, [it.q, ' ', h('button', { class: 'kb-btn', 'aria-label': L('听句子', 'Hear the sentence'), onclick: function () { sayTarget(it.q); } }, [icon('speaker')])]));
        if (it.r) stage.append(h('p', { class: 's3-r', lang: 'zh-Latn', text: it.r }));
        if (st.phase === 'place') stage.append(h('p', { class: 'kb-prompt', text: L('点一个编号，把' + nameOf(it.mover) + '放过去。', 'Click a number to put the ' + nameOf(it.mover) + ' there.') }), h('div', { class: 's3-opts' }, M.spots.map(function (s) { return h('button', { class: 'kb-btn', onclick: function () { onSpot(s.id); } }, String(s.n)); })));
        if (st.phase === 'follow') {
          stage.append(h('p', { class: 'kb-prompt', text: L('别的编号有没有可能也是这句话的意思？', 'Could another number also be what the sentence means?') }),
            h('div', { class: 's3-opts' }, [h('button', { class: 'kb-btn', onclick: function () { B.emit('select', { item: it.id, otherPossible: true }); finishPlace(st.followSpot, true, true); } }, L('有可能', 'Yes, it could')), h('button', { class: 'kb-btn', onclick: function () { B.emit('select', { item: it.id, otherPossible: false }); finishPlace(st.followSpot, true, false); } }, L('只有这一个', 'No, only this one'))]));

      } else {
        if (!st.answered) stage.append(h('p', { class: 'kb-prompt', text: child() ? L('选一句。', 'Choose one.') : L('选一句。先想，再看：用' + nameOf(it.viewer) + '的眼睛看算提示。', 'Choose one. Think first: looking through ' + nameOf(it.viewer) + '’s eyes counts as help.') }));

      }
      stage.append(fbBox());
      if (st.answered) stage.append(h('div', { class: 's3-row' }, [h('button', { class: 'kb-btn primary', onclick: next }, L('下一题 →', 'Next →')), h('span', { class: 'kb-note', text: child() ? L('按“当' + nameOf(it.kind === 'pick' ? it.viewer : it.ref) + '”看一看。', 'Press “Be ' + nameOf(it.kind === 'pick' ? it.viewer : it.ref) + '” and look.') : L('绕着转一转，看上面哪个词跟着变、哪个不变。', 'Turn the view and watch which word above changes and which does not.') })]));

    }
    function choiceRow(lab, opts, val, set) {
      return h('div', { class: 's3-row' }, [h('span', { class: 'kb-note', text: lab })].concat(opts.map(function (o) {
        return h('button', { class: 'kb-btn', 'aria-pressed': val === o[0] ? 'true' : 'false', onclick: function () { set(o[0]); } }, o[1]);
      })));
    }
    function renderMake() {
      var mk = st.make, s = SC.scenes[M.sceneId];
      stage.append(h('p', { class: 's3-sit', text: child() ? L('自己摆一摆，然后说给大人听。', 'Set it up, then say it to the adult.') : band === 'youth' ? L('自己摆一个场景，写一句话；写对了，再交给同伴照着你的话摆。', 'Set up a scene and write a sentence; when it matches, hand it to a partner who sets it up from your words.') : L('自己摆一个场景，写一句话。要两句：' + (st.mode === 'here' ? '一句东西在说话人身边，一句不在。' : st.mode === 'come' ? '一句朝说话人来，一句往别处去。' : '一句按看的人说，一句按车自己的方向说。'), 'Set up a scene and write a sentence. You need two: ' + (st.mode === 'here' ? 'one with the thing by the speaker, one with it away.' : st.mode === 'come' ? 'one moving toward the speaker, one moving away.' : 'one from the viewer, one by the car’s own front.')) }));
      if (mk.partner) {
        stage.append(h('div', { class: 'kb-feedback warn', text: L('交给同伴：先别看场景。读句子，然后摆出来。', 'Hand over to your partner: do not look at the scene yet. Read the sentence, then set it up.') }));
        stage.append(h('p', { class: 's3-q', lang: pack.lang, text: mk.partner.text }));
        if (st.mode === 'here') stage.append(h('p', { class: 'kb-note', text: L('说话的是 ', 'Speaking: ') + nameOf(mk.partner.setup.speaker) }), choiceRow(L('杯子在：', 'The cup is: '), [['nearA', L(nameOf('aki') + '身边', 'by ' + nameOf('aki'))], ['nearB', L(nameOf('ben') + '身边', 'by ' + nameOf('ben'))], ['far', L('离两人都远', 'far from both')]], null, partnerPick));
        else if (st.mode === 'come') stage.append(h('p', { class: 'kb-note', text: L('猫往', 'The cat goes into the ') + nameOf(mk.partner.setup.dir === 'kitchen' ? 'kitchen' : 'living') + L('走。', '.') }), choiceRow(L('说话的人在：', 'The speaker is in: '), [['kitchen', nameOf('kitchen')], ['living', nameOf('living')]], null, partnerPick));
        else stage.append(choiceRow(L('球在编号：', 'The ball is on spot: '), M.spots.map(function (sp) { return [sp.id, String(sp.n)]; }), null, partnerPick));
        return;
      }
      if (st.mode === 'here') {
        stage.append(choiceRow(L('谁说话：', 'Who speaks: '), [['aki', nameOf('aki')], ['ben', nameOf('ben')]], mk.speaker, function (v) { mk.speaker = v; B.emit('select', { item: 'make-here', speaker: v }); applyMake(); renderStage(); }));
        stage.append(choiceRow(L('杯子放在：', 'Put the cup: '), [['nearA', L(nameOf('aki') + '身边', 'by ' + nameOf('aki'))], ['nearB', L(nameOf('ben') + '身边', 'by ' + nameOf('ben'))], ['far', L('离两人都远', 'far from both')]], mk.slot, function (v) { mk.slot = v; B.emit('drop', { item: 'make-here', slot: v }); applyMake(); renderStage(); }));
      } else if (st.mode === 'come') {
        stage.append(choiceRow(L('说话的人在：', 'The speaker is in: '), [['kitchen', nameOf('kitchen')], ['living', nameOf('living')]], mk.where, function (v) { mk.where = v; B.emit('drop', { item: 'make-come', where: v }); applyMake(); renderStage(); }));
        stage.append(choiceRow(L('猫跑进：', 'The cat runs into: '), [['kitchen', nameOf('kitchen')], ['living', nameOf('living')]], mk.dir, function (v) { mk.dir = v; B.emit('select', { item: 'make-come', dir: v }); applyMake(); renderStage(); }));
      } else {
        stage.append(choiceRow(L('参照：', 'Reference: '), [['tree', nameOf('tree')], ['car', nameOf('car')]], mk.ref, function (v) { mk.ref = v; mk.spot = null; makeSpots(); applyMake(); renderStage(); }));
        if (mk.ref === 'car' && !child()) stage.append(choiceRow(L('按谁的方向：', 'Whose front: '), [['relative', L('从我这儿看', 'from where I stand')], ['intrinsic', L('车自己的方向', 'the car’s own')]], mk.frame, function (v) { mk.frame = v; applyMake(); renderStage(); }));
        stage.append(choiceRow(L('球放在编号：', 'Ball on spot: '), M.spots.map(function (sp) { return [sp.id, String(sp.n)]; }), mk.spot, makeSpot));
      }
      if (child()) {
        stage.append(h('div', { class: 'kb-card s3-adult' }, [h('p', { text: L('给陪着的大人：请孩子指着说一句，例如：', 'For the adult alongside: ask the child to point and say it, e.g. ') + (st.mode === 'here' ? pack.demo.speaker + ' / ' + pack.demo.far : st.mode === 'come' ? pack.motion.to + ' / ' + pack.motion.away : pack.relFmt.replace('{dir}', pack.dirs.front).replace('{ref}', pack.refNames.tree)) + L('。说得和摆的一样吗？', '. Did it match what they set up?') }),
          h('div', { class: 's3-row' }, [h('button', { class: 'kb-btn', onclick: function () { childMake(true); } }, L('说对了', 'Said it right')), h('button', { class: 'kb-btn', onclick: function () { childMake(false); } }, L('还没有', 'Not yet'))])]));
      } else {
        var ta = h('input', { class: 's3-text', type: 'text', lang: pack.lang, value: mk.text, placeholder: T(pack.make.placeholder[st.mode], 'zh'), 'aria-label': L('你的句子', 'Your sentence'), oninput: function (e) { mk.text = e.target.value; }, onkeydown: function (e) { if (e.key === 'Enter') checkMake(); } });
        stage.append(ta, h('div', { class: 's3-row' }, [h('button', { class: 'kb-btn primary', onclick: checkMake }, L('对照场景检查', 'Check against the scene')),
          band === 'youth' && mk.done.length ? h('button', { class: 'kb-btn', onclick: partnerStart }, L('交给同伴 →', 'Hand to a partner →')) : null,
          h('span', { class: 'kb-note', text: L('页面只查指示词、来去或方向词和场景是否一致，别的不判断。', 'The page only checks that the demonstrative, the come/go verb or the direction word fits the scene; nothing else.') })]));
      }
      if (mk.feedback) stage.append(h('div', { class: 'kb-feedback ' + (mk.feedback.tone || ''), text: mk.feedback.text }));
      if (mk.done.length) stage.append(h('ol', { class: 's3-made' }, mk.done.map(function (d) { return h('li', { lang: pack.lang, text: d.text }); })));
    }

    /* ---------- side panel ---------- */
    var ADULT_TIP = {
      here: L('问孩子：“' + '谁在说话？东西在谁身边？”让孩子先指，再选。', 'Ask: “Who is talking? Who is the thing next to?” Let the child point first, then choose.'),
      come: L('先按“看它走”，问孩子：“它朝谁走？”再按“当……”从那个人的眼睛看。', 'Press “Watch it move” and ask: “Who is it moving to?” Then press “Be …” to look through that one’s eyes.'),
      frame: L('让孩子站起来，转身面对屏幕，再把球“放”到自己前面、后面；然后当小熊看看。', 'Have the child stand up, face the screen and “put” the ball in front of or behind themselves; then be Bear and look.')
    };
    function progress() {
      return MODES.map(function (m) {
        var ids = [];
        pack.items.filter(function (it) { return it.mode === m.id; }).forEach(function (it) { ids.push(it.id); if (it.swap) ids.push(it.id + ':swap'); });
        var stt = ids.map(function (id) { return B.status(id); }).filter(Boolean);
        var ind = stt.filter(function (x) { return x === 'independent'; }).length, as = stt.filter(function (x) { return x === 'assisted'; }).length, wr = stt.filter(function (x) { return x === 'wrong'; }).length;
        return h('li', { text: m.label + L('：第一次就对 ' + ind + '，提示后对 ' + as + '，第一次错 ' + wr, ': right first time ' + ind + ', after help ' + as + ', wrong first ' + wr) });
      });
    }
    var recOpen = false;
    function renderSide() {
      side.innerHTML = '';
      var rule = pack.rules[st.mode], cmp = pack.compare[st.mode];
      if (band === 'adult') side.append(h('div', { class: 'kb-card s3-rule' }, [h('h2', { text: L('规则', 'The rule') }), h('p', { lang: EN ? 'en' : 'zh', text: T(rule, 'zh') }), h('p', { class: 'kb-note', text: L('和你的母语比：', 'Compared with your first language: ') + T(cmp, 'zh') })]));
      else if (band === 'youth') side.append(h('div', { class: 'kb-card s3-rule' }, st.tried[st.mode] ? [h('h2', { text: L('规则（你试过以后）', 'The rule (now that you have tried)') }), h('p', { text: T(rule, 'zh') }),
        st.mode === 'frame' ? h('p', { class: 'kb-note', text: L('两种参照：相对参照＝按看的人；固有参照＝按东西自己的前面。没有前面的东西只有相对参照。', 'Two frames: relative = from the viewer; intrinsic = by the thing’s own front. Things without a front have only the relative frame.') }) : null]
        : [h('h2', { text: L('规则', 'The rule') }), h('p', { class: 'kb-note', text: L('先自己试一题，规则在你作答后出现。', 'Try one first; the rule appears after your answer.') })]));
      else side.append(h('div', { class: 'kb-card s3-adult' }, [h('h2', { text: L('给陪着的大人', 'For the adult alongside') }), h('p', { text: ADULT_TIP[st.mode] }), h('p', { class: 'kb-note', text: L('页面会读出问题。孩子先做，再说一句。', 'The page reads the question aloud. The child acts first, then says a sentence.') })]));
      var recBody = [h('ul', { class: 's3-prog' }, progress()), h('p', { class: 'kb-note', text: L('这儿／那儿、来／去、前后左右分开记录：一种做得好，不代表另一种也会。', 'Here/there, come/go and front/back/left/right are recorded separately: doing well in one says nothing about the others.') })];
      // recordAudience (age-design.json): the child is not shown a score; the record sits collapsed, addressed to the adult alongside
      if (child()) side.append(h('details', { class: 'kb-card s3-rec', open: recOpen, ontoggle: function (e) { recOpen = e.target.open; } }, [h('summary', { text: L('给陪着的大人的记录', 'Record for the adult') })].concat(recBody)));
      else side.append(h('div', { class: 'kb-card' }, [h('h2', { text: L('三种分开记', 'Kept separately') })].concat(recBody)));
      side.append(h('div', { class: 'kb-card' }, [h('h2', { text: L('视图', 'View') }), h('p', { class: 'kb-note', text: renderNote }),
        R.kind === '3d' ? h('button', { class: 'kb-btn', onclick: function () { renderNote = L('二维图（自己切换的）', '2D drawings (switched by you)'); useRenderer('2d'); } }, L('换成二维图', 'Use 2D drawings')) : (window.THREE && !want ? h('button', { class: 'kb-btn', onclick: function () { renderNote = L('3D 视图（Three.js r128，来自 cdnjs）', '3D view (Three.js r128 from cdnjs)'); useRenderer('3d'); } }, L('换成 3D', 'Use 3D')) : null),
        h('p', { class: 'kb-note', text: L('拖动或用方向键绕着转；带眼睛图标的按钮换到某个人的眼睛。', 'Drag or use the arrow keys to turn; the buttons with an eye icon switch to someone’s eyes.') })]));
    }

    document.addEventListener('keydown', function (e) {
      if (e.target.closest && e.target.closest('input,textarea')) return;
      if (!/^[1-9]$/.test(e.key) || st.step === 'make' || !st.item) return;
      var k = +e.key - 1, it = st.item;
      if (it.mode === 'frame') { if (st.phase === 'pick' && it.options[k]) pickAnswer(k); else if (st.phase === 'place') { var s = M.spots.filter(function (x) { return x.n === k + 1; })[0]; if (s) onSpot(s.id); } return; }
      if ((st.phase === 'choose' || st.phase === 'swap-form') && !st.answered && cur().forms[k]) choose(k);
    });

    enterMode();
    renderSide();
  }
})();
